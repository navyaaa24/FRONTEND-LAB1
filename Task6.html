
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 6 - JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: darkblue;
        }

        .container {
            background-color: white;
            width: 70%;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: darkgreen;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: darkblue;
        }

        p {
            font-size: 16px;
            color: black;
        }

        @media (max-width: 600px) {
            .container {
                width: 90%;
                padding: 10px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <h1>JavaScript Functions and Array Methods</h1>

    <div class="container">

        <!-- 1. Function -->
        <h2>1. Function</h2>
        <button onclick="showMessage()">Click Me</button>
        <p id="functionResult"></p>

        <!-- 2. Closure -->
        <h2>2. Closure</h2>
        <button onclick="increaseCount()">Increase Counter</button>
        <p id="closureResult">Counter: 0</p>

        <!-- 3. IIFE -->
        <h2>3. IIFE</h2>
        <p id="iifeResult"></p>

        <!-- 4. Array Methods -->
        <h2>4. Array Methods</h2>
        <p>Original Array: 10, 20, 30, 40, 50</p>

        <button onclick="useMap()">Map</button>
        <p id="mapResult"></p>

        <button onclick="useFilter()">Filter</button>
        <p id="filterResult"></p>

        <button onclick="useReduce()">Reduce</button>
        <p id="reduceResult"></p>

        <button onclick="useForEach()">ForEach</button>
        <p id="forEachResult"></p>

    </div>

    <script>
        // 1. Function
        function showMessage() {
            document.getElementById("functionResult").innerHTML =
                "Hello! This is a JavaScript function.";
        }

        // 2. Closure
        function createCounter() {
            let count = 0;

            return function () {
                count++;

                document.getElementById("closureResult").innerHTML =
                    "Counter: " + count;
            };
        }

        let increaseCount = createCounter();

        // 3. IIFE
        (function () {
            document.getElementById("iifeResult").innerHTML =
                "IIFE executed automatically!";
        })();

        // Original Array
        let numbers = [10, 20, 30, 40, 50];

        // 4. map()
        function useMap() {
            let result = numbers.map(function (num) {
                return num * 2;
            });

            document.getElementById("mapResult").innerHTML =
                "Map Result: " + result;
        }

        // 5. filter()
        function useFilter() {
            let result = numbers.filter(function (num) {
                return num > 25;
            });

            document.getElementById("filterResult").innerHTML =
                "Filter Result: " + result;
        }

        // 6. reduce()
        function useReduce() {
            let result = numbers.reduce(function (total, num) {
                return total + num;
            }, 0);

            document.getElementById("reduceResult").innerHTML =
                "Total Sum: " + result;
        }

        // 7. forEach()
        function useForEach() {
            let result = "";

            numbers.forEach(function (num) {
                result += num + " ";
            });

            document.getElementById("forEachResult").innerHTML =
                "Array Elements: " + result;
        }
    </script>

</body>

</html>
