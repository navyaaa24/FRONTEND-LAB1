<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            border:5px solid red;
            border-radius:15px;
            outline:3px solid blue;
        }.box2{
            border:5px dashed green;
            outline:3px solid yellow;
        }.box3{
            border:5px dotted brown;
            outline:3px solid green;
        }.box4{
            border:5px double pink;
             outline:3px solid brown;
        }
        .circle{
            width:100px;
            height:100px;
            border:3px solid blue;
            border-radius:50%;
            text-align:center;
            line-height: 100px;
            outline:7px solid pink;
        }
        .gradient-box{
            width:200px;
            height:100px;
            background:linear-gradient(to top,red,blue,green,yellow,pink,brown,grey,silver);
            margin-top: 30px;
}.gradient-box1{
    width:200px;
            height:100px;
            background:radial-gradient(ellipse,green,blue,orange,cyan,red);
            margin-top: 30px;
}
.conic-box{
    width:200px;
    height:100px;
    background:conic-gradient(red 0deg,red 90deg,green 90deg,green 180deg, blue 180deg ,blue 270deg,yellow 270deg,yellow  360deg);
    margin-top:30px;
}button{
    background-color:greenyellow;
    color:black;
    padding:10px 20px;
    transition:background-color 5s;
    transition-duration:10s ;
    transition-timing-function:ease-in;
    transition-delay: 1s;

    margin-top: 30px;
} button:hover{
    background-color: red;
    
}
    </style>
</head>
<body>
    <h1 class="box1">Solid Border</h1>
    <h1 class="box2">Dashed Border</h1>
    <h1 class="box3">Dashed Border</h1>
    <h1 class="box4">Double Border</h1>
    <div class="circle">Circle</div>
    <div class="gradient-box"> Linear-Gradient</div>
    <div class="gradient-box1">Radial-Gradient</div>
    <div class="conic-box">Conic-Gradient</div>
    <button>Hover Me</button>
</body>
</html>
