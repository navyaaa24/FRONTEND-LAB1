<!DOCTYPE html>
<html>
<head>
    <title>Pie Chart</title>
    <link rel="stylesheet" href="piechart.css">
</head>

<body>

<div class="chart">

    <div class="label l1">
        <b>&gt;0 &amp; &lt;35</b>
        <span>12 students</span>
    </div>

    <div class="label l2">
        <b>&gt;35 &amp; &lt;55</b>
        <span>14 students</span>
    </div>

    <div class="label l3">
        <b>&gt;55 &amp; &lt;75</b>
        <span>42 students</span>
    </div>

    <div class="label l4">
        <b>&gt;76 &amp; &lt;90</b>
        <span>22 students</span>
    </div>

    <div class="label l5">
        <b>&gt;91 &amp; &lt;100</b>
        <span>4 students</span>
    </div>

</div>

</body>
</html>
